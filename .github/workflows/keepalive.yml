# Free Spaces sleep when idle; a ping every few hours keeps Axiom awake for visitors.
name: keepalive

on:
  schedule:
    - cron: "41 */4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 5 --retry-delay 20 --retry-all-errors "${{ secrets.AXIOM_URL }}/health"
